services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        HOST_UID: ${HOST_UID:-1001}
        HOST_GID: ${HOST_GID:-1001}
    container_name: magento-app
    ports:
      - "80:80"
      - "9003:9003"
    volumes:
      - ../:/var/www/html
      - composer-cache:/root/.composer/cache
    depends_on:
      mysql:
        condition: service_healthy
      opensearch:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      PHP_IDE_CONFIG: serverName=magento
      XDEBUG_CONFIG: client_host=host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - magento

  mysql:
    image: mysql:8.0
    container_name: magento-mysql
    command: --default-authentication-plugin=mysql_native_password --log-bin-trust-function-creators=1
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: magento
      MYSQL_USER: magento
      MYSQL_PASSWORD: magento
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - magento

  opensearch:
    image: opensearchproject/opensearch:2.12.0
    container_name: magento-opensearch
    ports:
      - "9200:9200"
      - "9600:9600"
    environment:
      - discovery.type=single-node
      - plugins.security.disabled=true
      - bootstrap.memory_lock=true
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200 | grep -q 'opensearch'"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - magento

  redis:
    image: redis:7.2-alpine
    container_name: magento-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - magento

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: magento-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: magento
      RABBITMQ_DEFAULT_PASS: magento
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - magento

  mailpit:
    image: axllent/mailpit:latest
    container_name: magento-mailpit
    ports:
      - "8025:8025"
      - "1025:1025"
    networks:
      - magento

volumes:
  mysql-data:
  opensearch-data:
  redis-data:
  rabbitmq-data:
  composer-cache:

networks:
  magento:
    driver: bridge
